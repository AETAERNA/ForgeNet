<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="60">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeVision Control Console</title>
<style>
body { background-color: #0b0c10; color: #c5c6c7; font-family: 'Courier New', monospace; margin: 0; padding: 0; }
header { background-color: #1f2833; color: #66fcf1; text-align: center; padding: 20px; font-size: 24px; }
section { display: flex; flex-wrap: wrap; justify-content: space-around; padding: 20px; }
.card { background-color: #1f2833; border: 1px solid #45a29e; border-radius: 10px; width: 45%; min-width: 280px; padding: 15px; margin: 10px; }
h2 { color: #66fcf1; margin-top: 0; }
.gauge { font-size: 20px; margin-top: 10px; }
.log { background-color: #0b0c10; border: 1px solid #45a29e; padding: 10px; height: 200px; overflow-y: scroll; font-size: 13px; }
footer { text-align: center; color: #45a29e; padding: 10px; font-size: 12px; }
</style>
</head>
<body>
<header>🚀 ForgeVision Live Control Console</header>

<section>
  <div class="card">
    <h2>Entropy Gauge</h2>
    <div class="gauge" id="entropyGauge">Loading...</div>
  </div>

  <div class="card">
    <h2>Creativity Index</h2>
    <div class="gauge" id="creativityGauge">Loading...</div>
  </div>

  <div class="card">
    <h2>Entropy Drift</h2>
    <div class="gauge" id="driftGauge">Loading...</div>
  </div>

  <div class="card">
    <h2>Narrator Feed</h2>
    <div class="log" id="narratorFeed">Awaiting updates...</div>
  </div>
</section>

<footer>ForgeNet · Auto-refreshing every 60 s</footer>

<script>
async function loadData() {
  try {
    const r = await fetch("forgevision_data.json?_=" + Date.now());
    const d = await r.json();
    document.getElementById("entropyGauge").innerText = d.entropy_avg.toFixed(3);
    document.getElementById("creativityGauge").innerText = d.creativity_avg.toFixed(3);
    document.getElementById("driftGauge").innerText = d.h2_avg.toFixed(3);
    document.getElementById("narratorFeed").innerText = d.narrator || 'Awaiting updates...';
  } catch(e) {
    document.getElementById("narratorFeed").innerText = 'Data bridge not yet initialized.';
  }
}
loadData();
</script>
</body>
</html>
